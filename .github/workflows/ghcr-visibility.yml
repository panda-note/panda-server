name: GHCR package visibility

# One-shot / ops helper: set ghcr.io/panda-note/panda-server public so
# README install (`docker pull`) works without a GitHub token.

on:
  workflow_dispatch:
    inputs:
      visibility:
        description: Package visibility
        type: choice
        options:
          - public
          - private
        default: public

permissions:
  packages: write

jobs:
  set-visibility:
    name: Set package visibility
    runs-on: ubuntu-latest
    steps:
      - name: Apply visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${{ github.repository_owner }}/packages/container/panda-server" \
            -f visibility=${{ inputs.visibility }}
          echo "Set panda-server package visibility to ${{ inputs.visibility }}"
