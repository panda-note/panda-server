name: Release Linux packages

# Baseline: Debian bookworm (glibc 2.36). Binary links libc/libm/libgcc_s only;
# SQLite is bundled. Suitable for Debian 12+ / Ubuntu 24.04+.
#
# On v* tags this workflow:
#   1) builds amd64/arm64 tarballs into a GitHub Release
#   2) publishes a multi-arch image to ghcr.io/panda-note/panda-server

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: panda-note/panda-server

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            # Native ARM avoids QEMU; bookworm image still sets the glibc baseline.
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binary (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: binary
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=dist-out
          cache-from: type=gha,scope=panda-linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=panda-linux-${{ matrix.arch }}

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          test -x dist-out/panda
          file dist-out/panda
          if command -v readelf >/dev/null; then
            readelf -d dist-out/panda | tee /tmp/panda-dyn.txt
            grep -E 'Shared library: \[lib(c|m|gcc_s)\.so' /tmp/panda-dyn.txt
            if grep -E 'Shared library: \[(libssl|libcrypto|libsqlite3|libstdc\+\+)' /tmp/panda-dyn.txt; then
              echo "unexpected shared library dependency" >&2
              exit 1
            fi
          fi
          staging="panda-linux-${{ matrix.arch }}"
          mkdir -p "${staging}"
          cp dist-out/panda "${staging}/panda"
          chmod 0755 "${staging}/panda"
          cp config/default.yml "${staging}/config.yml"
          cp openapi.yaml "${staging}/openapi.yaml"
          printf '%s\n' \
            'Panda Server Linux package' \
            '' \
            'Requires glibc >= 2.36 (Debian 12 bookworm / Ubuntu 24.04 or newer).' \
            'Dynamic deps: libc, libm, libgcc_s only (SQLite is bundled).' \
            '' \
            'Run:' \
            '  ./panda --config ./config.yml' \
            > "${staging}/README.txt"
          tar -czf "${staging}.tar.gz" "${staging}"
          ls -lh "${staging}.tar.gz"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: panda-linux-${{ matrix.arch }}
          path: panda-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Build and push image by digest
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=panda-ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=panda-ghcr-${{ matrix.arch }}

      - name: Export image digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p digests
          digest="${{ steps.image.outputs.digest }}"
          touch "digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: panda-linux-*
          merge-multiple: true
          path: packages

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ghcr-manifest:
    name: GHCR multi-arch manifest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          tag="${GITHUB_REF_NAME}"
          args=()
          for digest_file in digests/*; do
            args+=("${image}@sha256:$(basename "${digest_file}")")
          done
          docker buildx imagetools create \
            -t "${image}:${tag}" \
            -t "${image}:latest" \
            "${args[@]}"
          docker buildx imagetools inspect "${image}:${tag}"

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Anonymous docker pull requires public package visibility.
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${{ github.repository_owner }}/packages/container/panda-server/visibility" \
            -f visibility=public
